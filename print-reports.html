<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSL รายงานค่าอ้อย — ข้อมูลจำลอง</title><link rel="stylesheet" href="report.css?v=20261028-linked"><script src="report-renderer.js?v=20261028-linked"></script><script src="report-mock.js?v=20261028-linked"></script></head><body><div class="print-controls"><button id="print-button" disabled>กำลังเตรียมรายงาน…</button><span>เลือกเครื่องพิมพ์จริงและกดพิมพ์ · รายงานใช้ข้อมูลจำลอง</span></div><style>.print-controls{padding:12px;display:flex;gap:16px;align-items:center;font-family:sans-serif}.print-controls button{padding:12px 24px;cursor:pointer}@media print{.print-controls{display:none!important}}</style><main id="reports"></main><script>
(async()=>{

try{
 const companies=[{"key":"KKS","code":"01","name":"บริษัท น้ำตาลขอนแก่น จำกัด (มหาชน) สาขาน้ำพอง","factory":"น้ำพอง"},{"key":"WSP","code":"02","name":"บริษัท น้ำตาลขอนแก่น จำกัด (มหาชน) สาขาวังสะพุง","factory":"วังสะพุง"},{"key":"NKS","code":"03","name":"บริษัท น้ำตาลนิวกว้างสุ้นหลี จำกัด","factory":"นิวกว้างสุ้นหลี"},{"key":"NKT","code":"04","name":"บริษัท โรงงานน้ำตาลนิวกรุงไทย จำกัด","factory":"นิวกรุงไทย"},{"key":"TMK","code":"05","name":"บริษัท น้ำตาลท่ามะกา จำกัด","factory":"ท่ามะกา"}];
 const q=new URLSearchParams(location.search),codes=['KKS','WSP','NKS','NKT','TMK'];
 const code=codes.includes(q.get('company'))?q.get('company'):'KKS';
 const period=Math.min(12,Math.max(1,Number(q.get('period'))||1));
 const d=JSON.parse(JSON.stringify(window.KSLMockReport));
 const company=companies.find(c=>c.key===code);
 d.companyCode=company.code;d.companyName=company.name;
 d.factoryName=company.factory;d.period=String(period).padStart(2,'0');
 d.printedAt=new Intl.DateTimeFormat('th-TH-u-ca-gregory',{dateStyle:'short',timeStyle:'medium',timeZone:'Asia/Bangkok'}).format(new Date());
 const month=11+Math.floor((period-1)/2),year=2025+Math.floor(month/12),mo=month%12;
 const first=period%2===1?1:16,last=period%2===1?15:new Date(year,mo+1,0).getDate();
 const date=day=>String(day).padStart(2,'0')+'/'+String(mo+1).padStart(2,'0')+'/'+year;
 d.receipt.documentDate=date(last);d.receipt.documentNo='DEMO-'+code+'-'+d.cropYear+'-'+d.period;
 d.receipt.payments.forEach((p,i)=>{p.period=d.period;p.date=date(last);p.documentNo='DEMO-PAY-'+d.period+'-'+(i+1)});
 d.deliveries.forEach((r,i)=>{r.date=date(first+i%(last-first+1));r.ticketNo='DM'+d.period+String(i+1).padStart(4,'0')});
 document.getElementById('reports').innerHTML=KSLReport.receipt(d)+KSLReport.delivery(d);
 await document.fonts.ready;
 await Promise.all(Array.from(document.images).map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 window.__kslReportReady=true;
 if(q.get('native')==='1')document.querySelector('.print-controls').style.display='none';
 const button=document.getElementById('print-button');
 button.disabled=false;button.textContent='พิมพ์รายงานทั้ง 2 แบบ';
 button.addEventListener('click',()=>window.print());
 if(q.get('embedded')==='1'&&window.parent!==window){
  document.querySelector('.print-controls').style.display='none';
  let requested=false;
  const notify=type=>window.parent.postMessage({type},location.origin);
  window.addEventListener('message',event=>{
   if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='ksl-report-print'||requested)return;
   requested=true;
   try{window.focus();window.print();notify('ksl-report-returned')}catch(error){notify('ksl-report-error')}
  });
  notify('ksl-report-ready');
 }else if(q.get('autoprint')==='1')window.print();
 
 
}catch(e){if(window.parent!==window)window.parent.postMessage({type:'ksl-report-error'},location.origin);document.getElementById('reports').textContent='ไม่สามารถเตรียมรายงานได้ กรุณาลองใหม่'}
})();
</script></body></html>
