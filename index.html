<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KSL • Receipt On Demand</title><link rel="stylesheet" href="style.css"></head><body><div class="demo"><span>INTERACTIVE MOCKUP</span><span>ข้อมูลสาธิต · จำลองการพิมพ์</span></div><div class="shell"><header><div class="brand"><img src="ksl.png" alt="KSL Group"><span>Receipt<br><b>On Demand</b></span></div><div class="header-right"><div id="companyTag"></div><div id="screenIndicator"></div></div></header><main id="app"></main><footer><span>บริการเอกสารค่าอ้อยด้วยตนเอง</span><div class="footercontrols"><button id="fullscreen" class="fullscreenbutton" type="button">⛶ เต็มหน้าจอ</button><button id="idle-preview" class="textbutton" type="button" hidden>ดูหน้าพัก</button><button id="restart" class="textbutton">เริ่มทดลองใหม่</button></div><span id="clock"></span></footer></div><section id="screensaver" hidden aria-label="หน้าพักจอ"><button id="wake-screen" type="button" aria-label="แตะเพื่อกลับหน้ากรอกเลขโควต้า"><span class="idle-top"><span class="idle-status"><i></i> พร้อมให้บริการ</span><span class="idle-time"><span id="idle-clock"></span><span id="idle-date"></span></span></span><span class="idle-content"><span class="idle-logo"><img src="ksl.png" alt="KSL Group"></span><span class="idle-welcome">ยินดีต้อนรับ</span><span id="idle-company" class="idle-company"></span><span class="idle-title">บริการเอกสารค่าอ้อยด้วยตนเอง</span><span class="idle-subtitle">ใบเสร็จรับเงินค่าอ้อย · รายละเอียดการส่งอ้อย</span><span class="idle-touch"><span class="touch-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M19 25V10a4 4 0 0 1 8 0v13l3-2 4 3 4 1 2 7-5 11H21L10 30a4 4 0 0 1 6-5l3 3" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 14a13 13 0 0 1 26-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".4"/></svg></span><span>แตะหน้าจอเพื่อเริ่มใช้งาน<span class="idle-touch-sub">Touch anywhere to begin</span></span><span class="idle-arrow" aria-hidden="true">›</span></span></span><span class="idle-bottom">RECEIPT ON DEMAND <span>สะดวก รวดเร็ว พร้อมให้บริการ</span></span></button></section><dialog id="scan-dialog" aria-labelledby="scan-title"><div class="scan-top"><div><div class="eyebrow">SCAN BARCODE</div><h2 id="scan-title">สแกนเลขโควต้า</h2></div><button id="scan-close" type="button" class="secondary" aria-label="ปิดกล้อง">✕</button></div><div class="scan-camera"><video id="scan-video" autoplay muted playsinline></video><div class="scan-guide" aria-hidden="true"></div></div><p id="scan-status" role="status">กำลังเปิดกล้อง…</p><button id="scan-retry" type="button" class="primary full" hidden>ลองเปิดกล้องอีกครั้ง</button><button id="scan-cancel" type="button" class="secondary full">กลับไปใช้แป้นตัวเลข</button></dialog><dialog id="card-dialog" aria-labelledby="card-title"><div class="scan-top"><div><div class="eyebrow">บัตรประชาชน · เครื่องอ่าน</div><h2 id="card-title"></h2></div><button id="card-close" type="button" class="secondary" aria-label="ปิดหน้าจออ่านบัตร">✕</button></div><div id="card-reader-visual" class="card-reader-visual"><svg viewBox="0 0 320 180" aria-hidden="true"><rect x="55" y="102" width="210" height="65" rx="18" fill="#126146"/><rect x="80" y="115" width="160" height="8" rx="4" fill="#052e24"/><g class="demo-id-card"><rect x="95" y="12" width="130" height="87" rx="10" fill="#effbf3" stroke="#7bb99b" stroke-width="2"/><rect x="107" y="25" width="35" height="28" rx="5" fill="#dfc57a"/><path d="M155 31h55M155 43h40M109 68h101M109 80h65" stroke="#86b29e" stroke-width="5" stroke-linecap="round"/></g><circle cx="241" cy="146" r="5" fill="#92eeb2"/></svg></div><p id="card-status" role="status"></p><div class="card-mock-note">ยังไม่ได้เชื่อมต่อเครื่องอ่านบัตรประชาชน<br>ช่องกรอกเลขจะเปลี่ยนเมื่อได้รับเลขบัตรจริงจากเครื่องอ่านเท่านั้น</div><button id="card-cancel" class="textbutton full" type="button">ยกเลิกและกลับหน้ากรอกเลข</button
