<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KSL • Receipt On Demand</title><link rel="stylesheet" href="style.css?v=20261024-portrait"><style>#reader-settings{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;padding:8px;border:1px solid #c9dacf;border-radius:12px;color:#547463;background:#f6faf5}#reader-settings[hidden]{display:none}.id-methods{grid-template-columns:1fr}#card-dialog #reader-auth[hidden],#card-dialog .reader-controls[hidden]{display:none!important}@media(orientation:landscape) and (max-height:500px) and (pointer:coarse){#reader-settings{width:28px;height:28px;flex-basis:28px;padding:3px}}
/* Compact kiosk framing leaves more room for the main screen. */
header{padding:6px 2.5%;min-height:54px}
.brand{gap:12px}.brand img{width:82px;height:36px}.brand span{font-size:13px;line-height:1.15;padding-left:12px}
.pill{padding:3px 12px;font-size:13px}
.header-right .small{font-size:12px}#screenIndicator .step{font-size:10px;margin:2px 0 0}
footer{padding:2px 2.5%;min-height:28px;gap:8px;font-size:10px}
.footercontrols{gap:12px}.footercontrols .textbutton{font-size:10px;padding:2px}.fullscreenbutton{font-size:10px;padding:3px 7px}
#reader-settings{width:20px;height:20px;min-height:0;flex:0 0 20px;padding:3px;border:0;border-radius:4px;background:transparent;color:#547463;opacity:.25}
#reader-settings svg{width:13px;height:13px}
#reader-settings:hover,#reader-settings:focus-visible{opacity:.8}
@media(max-width:700px){
 header{padding:4px 12px;min-height:44px}.brand{gap:8px}.brand img{width:63px;height:29px}.brand span{font-size:10px;padding-left:8px}
 .pill{font-size:11px;padding:2px 8px}#screenIndicator .step{font-size:8px}
 footer{padding:2px 10px;min-height:26px}.footercontrols{gap:8px}.footercontrols .textbutton,.fullscreenbutton,#clock{font-size:9px}
}
@media(orientation:landscape) and (max-height:500px) and (pointer:coarse){
 header{padding:3px 12px;min-height:36px}.brand img{width:58px;height:26px}.brand span{font-size:10px}
 footer{min-height:24px;padding-block:1px}
}
</style></head><body><div class="shell"><header><div class="brand"><img src="ksl.png" alt="KSL Group"><span>Receipt<br><b>On Demand</b></span></div><div class="header-right"><div id="companyTag"></div><div id="screenIndicator"></div></div></header><main id="app"></main><footer><button id="reader-settings" type="button" aria-label="ตั้งค่าเครื่องอ่านบัตร" title="ตั้งค่าเครื่องอ่านบัตร" hidden><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button><div class="footercontrols"><button id="fullscreen" class="fullscreenbutton" type="button">⛶ เต็มหน้าจอ</button><button id="idle-preview" class="textbutton" type="button" hidden>ดูหน้าพัก</button><button id="restart" class="textbutton">เริ่มทดลองใหม่</button></div><span id="clock"></span></footer></div><section id="screensaver" hidden aria-label="หน้าพักจอ"><button id="wake-screen" type="button" aria-label="แตะเพื่อกลับหน้ากรอกเลขโควต้า"><span class="idle-top"><span class="idle-status"><i></i> พร้อมให้บริการ</span><span class="idle-time"><span id="idle-clock"></span><span id="idle-date"></span></span></span><span class="idle-content"><span class="idle-logo"><img src="ksl.png" alt="KSL Group"></span><span class="idle-welcome">ยินดีต้อนรับ</span><span id="idle-company" class="idle-company"></span><span class="idle-title">บริการเอกสารค่าอ้อยด้วยตนเอง</span><span class="idle-subtitle">ใบเสร็จรับเงินค่าอ้อย · รายละเอียดการส่งอ้อย</span><span class="idle-touch"><span class="touch-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M19 25V10a4 4 0 0 1 8 0v13l3-2 4 3 4 1 2 7-5 11H21L10 30a4 4 0 0 1 6-5l3 3" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 14a13 13 0 0 1 26-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".4"/></svg></span><span>แตะหน้าจอเพื่อเริ่มใช้งาน<span class="idle-touch-sub">Touch anywhere to begin</span></span><span class="idle-arrow" aria-hidden="true">›</span></span></span><span class="idle-bottom">RECEIPT ON DEMAND <span>สะดวก รวดเร็ว พร้อมให้บริการ</span></span></button></section><dialog id="scan-dialog" aria-labelledby="scan-title"><div class="scan-top"><div><div class="eyebrow">SCAN BARCODE</div><h2 id="scan-title">สแกนเลขโควต้า</h2></div><button id="scan-close" type="button" class="secondary" aria-label="ปิดกล้อง">✕</button></div><div class="scan-camera"><video id="scan-video" autoplay muted playsinline></video><div class="scan-guide" aria-hidden="true"></div></div><p id="scan-status" role="status">กำลังเปิดกล้อง…</p><button id="scan-retry" type="button" class="primary full" hidden>ลองเปิดกล้องอีกครั้ง</button><button id="scan-cancel" type="button" class="secondary full">กลับไปใช้แป้นตัวเลข</button></dialog><dialog id="card-dialog" aria-labelledby="card-title"><div class="scan-top"><div><div class="eyebrow">บัตรประชาชน · เครื่องอ่าน</div><h2 id="card-title"></h2></div><button id="card-close" type="button" class="secondary" aria-label="ปิดหน้าจออ่านบัตร">✕</button></div><div id="card-reader-visual" class="card-reader-visual"><svg viewBox="0 0 320 180" aria-hidden="true"><rect x="55" y="102" width="210" height="65" rx="18" fill="#126146"/><rect x="80" y="115" width="160" height="8" rx="4" fill="#052e24"/><g class="demo-id-card"><rect x="95" y="12" width="130" height="87" rx="10" fill="#effbf3" stroke="#7bb99b" stroke-width="2"/><rect x="107" y="25" width="35" height="28" rx="5" fill="#dfc57a"/><path d="M155 31h55M155 43h40M109 68h101M109 80h65" stroke="#86b29e" stroke-width="5" stroke-linecap="round"/></g><circle cx="241" cy="146" r="5" fill="#92eeb2"/></svg></div><p id="card-status" role="status"></p><div class="card-mock-note">ยังไม่ได้เชื่อมต่อเครื่องอ่านบัตรประชาชน<br>ช่องกรอกเลขจะเปลี่ยนเมื่อได้รับเลขบัตรจริงจากเครื่องอ่านเท่านั้น</div><button id="card-cancel" class="textbutton full" type="button">ยกเลิกและกลับหน้ากรอกเลข</button></dialog><script src="zxing-0.23.0.min.js"></script><script src="app.js?v=20261025-compact"></script><script src="fit.js"></script><script src="fullscreen.js"></script><script src="idle.js?v=20261025-compact"></script><script src="scanner.js"></script><script src="idcard.js?v=20261025-compact"></script></body></html>
